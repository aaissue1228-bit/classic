/* js/skills.js */
/**
 * 스킬도감 — List2형 UI · 직업 탭 · 마법 단계별 정리
 */
(function () {
  "use strict";

  var state = {
    classId: "prince",
    stage: "all",
    query: "",
  };

  function esc(s) {
    if (s == null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function data() {
    return window.SKILL_DATA || { classes: [] };
  }

  function classes() {
    return data().classes || [];
  }

  function currentClass() {
    var list = classes();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === state.classId) return list[i];
    }
    return list[0] || { skills: [], label: "" };
  }

  function fmt(n) {
    if (n == null || n === "" || n === "0") return "-";
    return String(n);
  }

  /** 직업별 고유 마법서 단계 (DB bookLevel → 고유 1단, 2단…) */
  var CLASS_UNIQUE_LEVELS = {
    prince: [15],
    knight: [11, 12],
    elf: [17, 18, 19, 20, 21, 22],
    wizard: [],
  };

  function stageLabel(lv, classId) {
    var n = Number(lv);
    var cid = classId || state.classId;
    var unique = CLASS_UNIQUE_LEVELS[cid] || [];
    var idx = unique.indexOf(n);
    if (idx >= 0) {
      var cls = currentClass();
      var name =
        (cls && cls.id === cid && cls.label) ||
        ({ prince: "군주", knight: "기사", elf: "요정", wizard: "마법사" }[cid] ||
          "고유");
      return name + " " + (idx + 1) + "단";
    }
    return n + "단";
  }

  function stageHeadLabel(lv, classId) {
    return stageLabel(lv, classId) + " 마법";
  }

  function stagesOf(cls) {
    var set = {};
    (cls.skills || []).forEach(function (s) {
      set[s.bookLevel] = true;
    });
    return Object.keys(set)
      .map(Number)
      .sort(function (a, b) {
        return a - b;
      });
  }

  function filteredSkills() {
    var cls = currentClass();
    var list = (cls && cls.skills) || [];
    var q = (state.query || "").trim().toLowerCase();

    if (state.stage !== "all") {
      var lv = Number(state.stage);
      list = list.filter(function (s) {
        return Number(s.bookLevel) === lv;
      });
    }

    if (q.length >= 2) {
      list = list.filter(function (s) {
        var name = String(s.name || "").toLowerCase();
        var desc = String(s.desc || "").toLowerCase();
        return name.indexOf(q) !== -1 || desc.indexOf(q) !== -1;
      });
    }

    return list.slice().sort(function (a, b) {
      var la = Number(a.bookLevel) || 0;
      var lb = Number(b.bookLevel) || 0;
      if (la !== lb) return la - lb;
      return (Number(a.slot) || 0) - (Number(b.slot) || 0);
    });
  }

  function imgPath(s) {
    if (s.img) return s.img;
    if (s.imgKey && state.classId) {
      var __p = "img/skills/" + state.classId + "/" + s.imgKey + ".png"; return IMG[__p] || __p;
    }
    return "";
  }

  function thumbHtml(s) {
    var path = imgPath(s);
    var iconInner = path
      ? '<img src="' +
        esc(path) +
        '" alt="" width="44" height="44" loading="lazy" ' +
        'onerror="this.parentNode.classList.add(\'is-empty\');this.remove();" />'
      : "";
    var cls = "sk-spell-icon" + (path ? "" : " is-empty");
    return '<div class="' + cls + '">' + iconInner + "</div>";
  }

  function isUniqueBookLevel(lv, classId) {
    var cid = classId || state.classId;
    var unique = CLASS_UNIQUE_LEVELS[cid] || [];
    return unique.indexOf(Number(lv)) >= 0;
  }

  function spellCell(s) {
    var cls = currentClass();
    var desc = (s.desc || "").trim();
    var stage = stageLabel(s.bookLevel);
    var sub = isUniqueBookLevel(s.bookLevel)
      ? stage
      : (cls.label || "") + " · " + stage;
    return (
      '<div class="sk-spell">' +
      thumbHtml(s) +
      '<div class="sk-spell-text">' +
      '<div class="sk-spell-name">' +
      esc(s.name) +
      (s.passive ? '<span class="sk-badge">패시브</span>' : "") +
      "</div>" +
      '<div class="sk-spell-sub">' +
      esc(sub) +
      "</div>" +
      (desc ? '<div class="sk-spell-desc">' + esc(desc) + "</div>" : "") +
      "</div></div>"
    );
  }

  function isShortDuration(d) {
    if (!d || d === "-") return false;
    var s = String(d);
    if (/초/.test(s) && !/분|시/.test(s)) return true;
    var n = parseInt(s.replace(/,/g, ""), 10);
    return !isNaN(n) && n > 0 && n < 120 && !/분|시/.test(s);
  }

  function timeBadge(d) {
    var text = d || "-";
    var short = isShortDuration(text);
    return (
      '<span class="sk-time' +
      (short ? " is-short" : "") +
      '">' +
      esc(text) +
      "</span>"
    );
  }

  function renderClassTabs() {
    var box = document.getElementById("sk-class-tabs");
    if (!box) return;
    box.innerHTML = classes()
      .map(function (c) {
        return (
          '<button type="button" class="sk-tab' +
          (c.id === state.classId ? " is-active" : "") +
          '" data-class="' +
          esc(c.id) +
          '" role="tab" aria-selected="' +
          (c.id === state.classId ? "true" : "false") +
          '">' +
          esc(c.label || c.id) +
          " 마법</button>"
        );
      })
      .join("");
  }

  function renderStageTabs() {
    var box = document.getElementById("sk-stage-tabs");
    if (!box) return;
    var stages = stagesOf(currentClass());
    var html =
      '<button type="button" class="sk-stage-tab' +
      (state.stage === "all" ? " is-active" : "") +
      '" data-stage="all" role="tab">전체</button>';
    stages.forEach(function (lv) {
      html +=
        '<button type="button" class="sk-stage-tab' +
        (String(state.stage) === String(lv) ? " is-active" : "") +
        '" data-stage="' +
        lv +
        '" role="tab">' +
        esc(stageLabel(lv)) +
        "</button>";
    });
    box.innerHTML = html;
  }

  function rowHtml(s) {
    return (
      '<tr class="sk-row">' +
      '<td class="sk-col-spell">' +
      spellCell(s) +
      "</td>" +
      "<td>" +
      esc(fmt(s.hp)) +
      "</td>" +
      "<td>" +
      esc(fmt(s.mp)) +
      "</td>" +
      "<td>" +
      timeBadge(s.duration) +
      "</td>" +
      "<td>" +
      esc(s.element || "-") +
      "</td>" +
      "</tr>"
    );
  }

  function renderTable() {
    var tbody = document.getElementById("sk-tbody");
    var empty = document.getElementById("sk-empty");
    if (!tbody) return;

    var list = filteredSkills();
    if (!list.length) {
      tbody.innerHTML = "";
      if (empty) {
        empty.hidden = false;
        empty.textContent =
          (state.query || "").trim().length >= 2
            ? "검색 결과가 없습니다."
            : "해당 단계의 스킬이 없습니다.";
      }
      return;
    }
    if (empty) empty.hidden = true;

    var html = [];
    var showGroups = state.stage === "all";
    var lastLv = null;

    list.forEach(function (s) {
      var lv = Number(s.bookLevel);
      if (showGroups && lv !== lastLv) {
        lastLv = lv;
        var count = list.filter(function (x) {
          return Number(x.bookLevel) === lv;
        }).length;
        html.push(
          '<tr class="sk-stage-head"><td colspan="5">' +
            '<span class="sk-stage-title">' +
            esc(stageHeadLabel(lv)) +
            "</span>" +
            '<span class="sk-stage-count">' +
            count +
            "개</span></td></tr>"
        );
      }
      html.push(rowHtml(s));
    });

    tbody.innerHTML = html.join("");
  }

  function resetView() {
    state.stage = "all";
    state.query = "";
    var input = document.getElementById("sk-search-input");
    if (input) input.value = "";
    renderAll();
  }

  function renderAll() {
    renderClassTabs();
    renderStageTabs();
    renderTable();
  }

  function bind() {
    var classTabs = document.getElementById("sk-class-tabs");
    if (classTabs) {
      classTabs.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-class]");
        if (!btn) return;
        state.classId = btn.getAttribute("data-class") || "prince";
        state.stage = "all";
        state.query = "";
        var input = document.getElementById("sk-search-input");
        if (input) input.value = "";
        renderAll();
      });
    }

    var stageTabs = document.getElementById("sk-stage-tabs");
    if (stageTabs) {
      stageTabs.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-stage]");
        if (!btn) return;
        state.stage = btn.getAttribute("data-stage") || "all";
        renderStageTabs();
        renderTable();
      });
    }

    var home = document.getElementById("sk-home");
    if (home) home.addEventListener("click", resetView);

    var input = document.getElementById("sk-search-input");
    if (input) {
      var timer = null;
      input.addEventListener("input", function () {
        clearTimeout(timer);
        timer = setTimeout(function () {
          state.query = input.value || "";
          renderTable();
        }, 180);
      });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          state.query = input.value || "";
          renderTable();
        }
      });
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    bind();
    var meta = data().meta || {};
    if (meta.defaultClass) state.classId = meta.defaultClass;
    renderAll();
  });
})();

</script>
</body>
</html>
